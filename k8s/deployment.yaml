apiVersion: apps/v1
kind: Deployment
metadata:
  name: webmcp
  namespace: lulu
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: webmcp
  template:
    metadata:
      labels:
        app: webmcp
    spec:
      containers:
        - name: webmcp
          image: WEBMCP_IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 20"]
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: BASE_PATH
              value: "/webmcp"
            - name: LULU_ADS_PUBLISHER_ID
              valueFrom:
                secretKeyRef:
                  name: lulu-secrets
                  key: WEBMCP_ADS_PUBLISHER_ID
            - name: LULU_ADS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lulu-secrets
                  key: WEBMCP_ADS_API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
