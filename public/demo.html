<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebMCP — trip planning, chat demo</title>
<style>
  /* Same brand tokens as index.html, pulled from the real lulu-ads widget
     bundle (python/lulu_ads/widgets.py's FRAME_HTML). */
  :root {
    --lw-radius: 16px;
    --lw-ink: #f5f2ee;
    --lw-ink-soft: rgba(255,255,255,.72);
    --lw-ink-faint: rgba(255,255,255,.5);
    --lw-orange: #E8763C;
    --lw-mono: "SF Mono", ui-monospace, Menlo, monospace;
  }
  html, body {
    background: #16140f;
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { color: var(--lw-ink); display: flex; flex-direction: column; min-height: 100vh; }
  a { color: var(--lw-orange); }

  header { padding: 20px 20px 0; max-width: 720px; margin: 0 auto; width: 100%; box-sizing: border-box; }
  .wordmark {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--lw-ink-faint); text-decoration: none;
  }
  .wordmark b { color: var(--lw-orange); }
  h1 { font-size: 22px; font-weight: 600; margin: 10px 0 4px; letter-spacing: -.01em; }
  header p { color: var(--lw-ink-soft); font-size: 13.5px; line-height: 1.5; margin: 0 0 16px; }
  header p a { color: var(--lw-ink-soft); text-decoration: underline; }

  main {
    flex: 1; max-width: 720px; margin: 0 auto; width: 100%; box-sizing: border-box;
    display: flex; flex-direction: column; padding: 0 20px 20px;
  }

  #thread {
    flex: 1; display: flex; flex-direction: column; gap: 14px;
    padding: 8px 0 20px; overflow-y: auto;
  }

  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .msg.assistant { justify-content: flex-start; }
  .bubble {
    max-width: 82%; padding: 11px 15px; border-radius: 14px; font-size: 14.5px;
    line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user .bubble {
    background: linear-gradient(180deg, #F5A053 0%, #E8763C 55%, #D95F27 100%);
    color: #fff; border-bottom-right-radius: 4px; font-weight: 500;
  }
  .msg.assistant .bubble {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08);
    color: var(--lw-ink); border-bottom-left-radius: 4px;
  }

  .tool-card {
    max-width: 82%; margin-top: 6px; border-radius: var(--lw-radius); overflow: hidden;
    background: linear-gradient(168deg, #2a2723 0%, #232019 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 10px 26px -12px rgba(0,0,0,.5);
  }
  .tool-body { padding: 14px 16px 12px; }
  .tool-eyebrow {
    font-size: 10.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase;
    color: var(--lw-ink-soft); margin-bottom: 8px;
  }
  .stat { font-size: 36px; font-weight: 300; line-height: 1.05; margin: 4px 0 2px; letter-spacing: -.02em; }
  .lw-row {
    display: flex; justify-content: space-between; gap: 12px; font-size: 13px;
    color: var(--lw-ink-soft); padding: 7px 0; border-top: 1px solid rgba(255,255,255,.08);
  }
  .lw-row b, .lw-row span:last-child { color: var(--lw-ink); font-weight: 600; text-align: right; font-family: var(--lw-mono); }
  .lw-attr { font-size: 10px; color: var(--lw-ink-faint); margin-top: 8px; }

  .lw-strip {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: rgba(0,0,0,.30); font-size: 12px;
  }
  .lw-strip .badge {
    background: linear-gradient(180deg, #F5A053 0%, #E8763C 55%, #D95F27 100%);
    color: #fff; font-size: 9px; font-weight: 800; letter-spacing: .12em;
    border-radius: 6px; padding: 4px 8px; flex-shrink: 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  }
  .lw-strip .txt { flex: 1; color: var(--lw-ink); min-width: 0; }
  .lw-strip .cta { color: #FFC46B; font-weight: 700; white-space: nowrap; flex-shrink: 0; font-size: 12px; }
  .lw-strip .via { font-size: 10.5px; color: var(--lw-ink-faint); white-space: nowrap; flex-shrink: 0; }

  .typing { display: flex; gap: 4px; padding: 4px 2px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--lw-ink-faint);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

  form#composer {
    display: flex; gap: 8px; padding: 12px; border-radius: 14px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
  }
  #input {
    flex: 1; background: transparent; border: none; color: var(--lw-ink);
    font-size: 14.5px; font-family: inherit; padding: 6px 4px; outline: none;
  }
  #input::placeholder { color: var(--lw-ink-faint); }
  #send {
    background: linear-gradient(180deg, #F5A053 0%, #E8763C 55%, #D95F27 100%);
    color: #fff; font-weight: 700; font-size: 13.5px; border: none; border-radius: 9px;
    padding: 9px 18px; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  }
  #send:disabled { opacity: .5; cursor: default; }
  #send:not(:disabled):hover { filter: brightness(1.05); }

  .suggestions { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0 12px; }
  .suggestion {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    color: var(--lw-ink-soft); font-size: 12.5px; border-radius: 999px;
    padding: 7px 13px; cursor: pointer; font-family: inherit;
  }
  .suggestion:hover { background: rgba(255,255,255,.1); color: var(--lw-ink); }
</style>
</head>
<body>
<header>
  <a class="wordmark" href="https://getlulu.dev">Powered by <b>Lulu Ads</b></a>
  <h1>Plan a trip, chat-style</h1>
  <p>This talks to a real Gemini function-calling loop with the same two WebMCP
  tools from the <a href="./">manual demo</a> — <code>get_weather</code> and
  <code>search_flights</code>. Ask about a destination and watch the model
  decide when to call them.</p>
</header>

<main>
  <div id="thread"></div>
  <div class="suggestions" id="suggestions">
    <button class="suggestion" type="button" data-q="What's the weather like in Bangkok right now?">Weather in Bangkok?</button>
    <button class="suggestion" type="button" data-q="Find me a flight from TLV to BKK on 2026-09-20">Flight TLV → BKK</button>
    <button class="suggestion" type="button" data-q="I'm planning a trip to Tokyo, what should I know?">Planning a Tokyo trip</button>
  </div>
  <form id="composer">
    <input id="input" type="text" placeholder="Ask about weather or flights…" autocomplete="off">
    <button id="send" type="submit">Send</button>
  </form>
</main>

<script src="demo.js"></script>
</body>
</html>
